apiVersion: '2019-12-01'
location: polandcentral
name: kalendarz-app
type: Microsoft.ContainerInstance/containerGroups
properties:
  osType: Linux
  restartPolicy: Always
  containers:
    - name: myapp
      properties:
        image: kalendarzcr-fwdnexfdgcdfeugb.azurecr.io/myapp:latest
        ports:
          - port: 80
        resources:
          requests:
            cpu: 1.0
            memoryInGB: 1.5
  imageRegistryCredentials:
    - server: kalendarzcr-fwdnexfdgcdfeugb.azurecr.io
      username: "$REGISTRY_USERNAME"
      password: "$REGISTRY_PASSWORD"
  ipAddress:
    type: Public
    ports:
      - protocol: tcp
        port: 80