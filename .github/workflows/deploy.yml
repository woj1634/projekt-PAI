name: Build and Deploy Split Containers

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.REGISTRY_NAME }}.azurecr.io/myapp-backend:latest ./backend
          docker push ${{ secrets.REGISTRY_NAME }}.azurecr.io/myapp-backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.REGISTRY_NAME }}.azurecr.io/myapp-frontend:latest ./frontend
          docker push ${{ secrets.REGISTRY_NAME }}.azurecr.io/myapp-frontend:latest

      - name: Trigger Azure Backend Webhook
        run: |
          curl -X POST "${{ secrets.AZURE_BACKEND_WEBHOOK_URL }}"