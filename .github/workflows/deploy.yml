name: Build and Deploy

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.REGISTRY_NAME }}.azurecr.io/myapp:latest .
          docker push ${{ secrets.REGISTRY_NAME }}.azurecr.io/myapp:latest

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instances
        run: |
          az container create \
            --resource-group Projekt_TC \
            --name kalendarz-app \
            --image ${{ secrets.REGISTRY_NAME }}.azurecr.io/myapp:latest \
            --registry-login-server ${{ secrets.REGISTRY_NAME }}.azurecr.io \
            --registry-username ${{ secrets.REGISTRY_USERNAME }} \
            --registry-password ${{ secrets.REGISTRY_PASSWORD }} \
            --environment-variables MONGO_URI=${{ secrets.MONGO_URI_SECRET }} PORT=5000 \
            --cpu 1.0 \
            --memory 1.5 \
            --ports 80